<header class="border-b border-slate-800 bg-slate-900">
  <div class="mx-auto flex max-w-6xl flex-col gap-3 px-6 py-3 sm:flex-row sm:items-center sm:justify-between">
    <div class="flex items-center gap-3">
      <span class="flex size-9 shrink-0 items-center justify-center rounded-lg bg-emerald-400/10 text-emerald-300" aria-hidden="true">
        <i class="pi pi-book text-xl"></i>
      </span>
      <a routerLink="/" class="text-lg font-semibold tracking-tight text-slate-100 sm:text-xl">Bookstore</a>
    </div>
    <div class="flex items-center gap-3">
      <p-button label="Add book" icon="pi pi-plus" (onClick)="booksService.addBookVisible.set(true)" />
      <div class="min-w-0 flex-1 sm:w-56">
        <label for="genre-filter" class="sr-only">Genre</label>
        <p-select inputId="genre-filter" [options]="genres" optionLabel="label" optionValue="value"
          [ngModel]="booksService.search().genre" (ngModelChange)="booksService.selectGenre($event)"
          appendTo="body" class="w-full" />
      </div>
    </div>
  </div>
</header>
