<p-dialog header="Edit book" [visible]="bookId !== null" (visibleChange)="close()"
  [modal]="true" [draggable]="false" [resizable]="false" [blockScroll]="true"
  [closable]="!saving()" [closeOnEscape]="!saving()"
  [style]="{ width: '40rem', maxWidth: '95vw' }" appendTo="body">
  @if (error()) {
    <div class="mb-4" role="alert"><p-message severity="error">{{ error() }}</p-message></div>
  }
  @if (loading()) {
    <p class="py-6 text-center text-sm text-slate-400" role="status">Loading book...</p>
  } @else if (book(); as currentBook) {
    <div class="mb-5">
      <div class="font-medium text-slate-100">{{ currentBook.title }}</div>
      <div class="mt-1 text-sm text-slate-400">{{ currentBook.author }}</div>
      <div class="mt-1 text-xs text-slate-500">{{ currentBook.isbn }}</div>
    </div>
    <div class="grid gap-4 sm:grid-cols-3">
      <div class="flex flex-col gap-2">
        <label for="edit-genre">Genre</label>
        <p-select inputId="edit-genre" [options]="genres" [(ngModel)]="genre" [disabled]="saving()"
          appendTo="body" class="w-full" />
      </div>
      <div class="flex min-w-0 flex-col gap-2">
        <label for="edit-price">Price</label>
        <p-inputNumber inputId="edit-price" [(ngModel)]="price" mode="currency" currency="USD" locale="en-US"
          [min]="0" [max]="99999999.99" [minFractionDigits]="2" [maxFractionDigits]="2" [disabled]="saving()"
          class="w-full" inputStyleClass="w-full" />
      </div>
      <div class="flex min-w-0 flex-col gap-2">
        <label for="edit-stock">Stock</label>
        <p-inputNumber inputId="edit-stock" [(ngModel)]="stock" [min]="0" [max]="2147483647"
          [maxFractionDigits]="0" [useGrouping]="false" [disabled]="saving()" class="w-full" inputStyleClass="w-full" />
      </div>
    </div>
  } @else {
    <p-button label="Try again" icon="pi pi-refresh" severity="secondary" (onClick)="loadBook()" />
  }
  <ng-template #footer>
    <p-button label="Cancel" severity="secondary" [outlined]="true" [disabled]="saving()" (onClick)="close()" />
    @if (book()) {
      <p-button label="Save changes" icon="pi pi-check" [loading]="saving()"
        [disabled]="!genre || price === null || stock === null || saving()" (onClick)="saveBook()" />
    }
  </ng-template>
</p-dialog>
